[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organizador-carpetas"
version = "2.1.0"
description = "Organiza archivos por tipo y reúne tus proyectos de código en una sola carpeta."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cristian Carrera" }]
keywords = ["organizador", "archivos", "cli", "automatización"]

# Sin dependencias a propósito: sólo biblioteca estándar. Así el organizador
# funciona en cualquier equipo sin pasar por pip.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
organizador = "organizador.cli:main"

[project.urls]
Repository = "https://github.com/Criscarr26/folder-organizer"

[tool.setuptools]
packages = ["organizador"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
