name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows y Linux porque el organizador depende de detalles del sistema
        # de archivos: mayúsculas, límite de longitud de ruta y sólo-lectura.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Comprobar que arranca sin dependencias
        run: python main.py --help

      - name: Instalar pytest
        run: python -m pip install -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest tests -q
